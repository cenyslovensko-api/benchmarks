<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CenySlovensko Benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .logo {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-light), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-left: auto;
    }

    #updated-at {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem;
    }

    #empty-state {
      text-align: center;
      padding: 6rem 2rem;
      color: var(--text-muted);
    }

    #empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    #empty-state code {
      background: var(--surface2);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.875rem;
      color: var(--accent-light);
    }

    .benchmark-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
      gap: 1.5rem;
    }

    .benchmark-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      word-break: break-all;
    }

    .card-repo {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .card-stats {
      display: flex;
      gap: 1.5rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .stat {
      text-align: right;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.up   { color: var(--green); }
    .stat-value.down { color: var(--red);   }
    .stat-value.neutral { color: var(--text); }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
    }

    .trend-badge.up   { background: rgba(34,197,94,0.15);  color: var(--green); }
    .trend-badge.down { background: rgba(239,68,68,0.15);  color: var(--red);   }
    .trend-badge.flat { background: rgba(100,116,139,0.2); color: var(--text-muted); }

    .chart-wrap {
      position: relative;
      height: 200px;
    }

    .recent-table {
      font-size: 0.8rem;
      border-collapse: collapse;
      width: 100%;
    }

    .recent-table th {
      text-align: left;
      padding: 0.4rem 0.6rem;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }

    .recent-table td {
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }

    .recent-table td:nth-child(2) {
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .recent-table tr:last-child td { border-bottom: none; }

    details > summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    details > summary::before {
      content: "▶";
      font-size: 0.65rem;
      transition: transform 0.15s;
    }

    details[open] > summary::before { transform: rotate(90deg); }

    details > .table-wrap {
      margin-top: 0.75rem;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .client-section {
      margin-bottom: 3rem;
    }

    .client-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .client-icon {
      font-size: 1.4rem;
      line-height: 1;
    }

    .client-name {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .client-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      margin-left: auto;
    }

  </style>
</head>
<body>

<header>
  <span class="logo">⚡ CenySlovensko Benchmarks</span>
  <span class="subtitle">Historical performance tracking</span>
  <span id="updated-at">Loading…</span>
</header>

<main>
  <div id="empty-state" style="display:none">
    <h2>No benchmarks yet</h2>
    <p style="margin-top:0.5rem">
      Submit your first data point using the reusable workflow or the CLI script:<br><br>
      <code>python scripts/add_benchmark.py --client python --benchmark api_latency --value 42 --unit ms</code>
    </p>
  </div>
  <div id="clients"></div>
</main>

<script>
const PALETTE = [
  "#818cf8", "#34d399", "#f472b6", "#fb923c",
  "#38bdf8", "#a78bfa", "#4ade80", "#facc15"
];

const CLIENT_ICONS = {
  python: "🐍", go: "🐹", rust: "🦀",
  java: "☕", node: "🟢", typescript: "🔷",
  ruby: "💎", cpp: "⚙️", dotnet: "🔵",
};

function safe(name) {
  return name.replace(/[^a-zA-Z0-9_\-.]/g, "_");
}

// Stage 1: root index
async function fetchRootIndex() {
  const res = await fetch("data/index.json");
  if (!res.ok) throw new Error("Failed to fetch data/index.json");
  return res.json();
}

// Stage 2: all client indexes in parallel
async function fetchClientIndexes(clients) {
  return Promise.all(clients.map(async client => {
    const res = await fetch(`data/${safe(client)}/index.json`);
    if (!res.ok) throw new Error(`Failed to fetch data/${safe(client)}/index.json`);
    const data = await res.json();
    return { client, benchmarks: data.benchmarks ?? [] };
  }));
}

// Stage 3: all metric files across all clients in parallel
async function fetchAllMetrics(clientIndexes) {
  const tasks = clientIndexes.flatMap(({ client, benchmarks }) =>
    benchmarks.map(async benchmark => {
      const res = await fetch(`data/${safe(client)}/${safe(benchmark)}.json`);
      if (!res.ok) throw new Error(`Failed to fetch data/${safe(client)}/${safe(benchmark)}.json`);
      const data = await res.json();
      return { client, benchmark, entries: (data.entries ?? []).slice().sort((a, b) => a.timestamp.localeCompare(b.timestamp)) };
    })
  );
  return Promise.all(tasks);
}

async function loadAll() {
  const root = await fetchRootIndex();
  const clients = root.clients ?? [];
  if (clients.length === 0) return [];

  const clientIndexes = await fetchClientIndexes(clients);

  const metrics = await fetchAllMetrics(clientIndexes);

  // Group by client, preserving client order
  return clientIndexes.map(({ client, benchmarks }) => ({
    client,
    benchmarks: benchmarks.map(benchmark => {
      const m = metrics.find(x => x.client === client && x.benchmark === benchmark);
      return { name: benchmark, entries: m?.entries ?? [] };
    })
  }));
}

// ── Rendering helpers ────────────────────────────────────────────────────────

function formatValue(v, unit) {
  return `${Number.isInteger(v) ? v : v.toFixed(2)} ${unit}`;
}

function calcTrend(points) {
  if (points.length < 2) return { dir: "flat", pct: 0 };
  const prev = points[points.length - 2].value;
  const curr = points[points.length - 1].value;
  const pct = prev === 0 ? 0 : ((curr - prev) / Math.abs(prev)) * 100;
  const dir = Math.abs(pct) < 0.5 ? "flat" : pct > 0 ? "up" : "down";
  return { dir, pct };
}

function formatDate(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escId(client, name) {
  return `${client}__${name}`.replace(/[^a-z0-9]/gi, "_");
}

function buildCard(client, benchmarkName, points, colorIndex) {
  const color = PALETTE[colorIndex % PALETTE.length];
  const unit = points[points.length - 1]?.unit ?? "";
  const latest = points[points.length - 1]?.value ?? 0;
  const best = points.length ? Math.min(...points.map(p => p.value)) : 0;
  const avg = points.length ? points.reduce((s, p) => s + p.value, 0) / points.length : 0;
  const trend = calcTrend(points);
  const repos = [...new Set(points.map(p => p.repository).filter(Boolean))];

  const trendArrow = trend.dir === "flat" ? "→" : trend.dir === "up" ? "↑" : "↓";
  const trendLabel = trend.dir === "flat" ? "stable" : `${trendArrow} ${Math.abs(trend.pct).toFixed(1)}%`;
  const canvasId = `chart-${escId(client, benchmarkName)}`;

  const card = document.createElement("div");
  card.className = "benchmark-card";
  card.innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-title">${escHtml(benchmarkName)}</div>
        ${repos.length ? `<div class="card-repo">${repos.map(escHtml).join(", ")}</div>` : ""}
      </div>
      <div class="card-stats">
        <div class="stat">
          <div class="stat-label">Latest</div>
          <div class="stat-value neutral">${formatValue(latest, unit)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best</div>
          <div class="stat-value up">${formatValue(best, unit)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg</div>
          <div class="stat-value neutral">${formatValue(avg, unit)}</div>
        </div>
      </div>
      <span class="trend-badge ${trend.dir}">${trendLabel}</span>
    </div>
    <div class="chart-wrap"><canvas id="${canvasId}"></canvas></div>
    <details>
      <summary>Recent runs (${points.length})</summary>
      <div class="table-wrap">
        <table class="recent-table">
          <thead><tr><th>Time</th><th>Value</th><th>Commit</th><th>Repo</th></tr></thead>
          <tbody>
            ${[...points].reverse().slice(0, 50).map(p => `
              <tr>
                <td>${formatDate(p.timestamp)}</td>
                <td>${formatValue(p.value, p.unit)}</td>
                <td>${p.commit ? `<code>${escHtml(p.commit.slice(0, 7))}</code>` : "—"}</td>
                <td>${escHtml(p.repository ?? "—")}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </details>
  `;

  return { card, color, unit, canvasId };
}

function renderChart(canvasId, points, color, unit) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  new Chart(ctx, {
    type: "line",
    data: {
      datasets: [{
        label: unit,
        data: points.map(p => ({ x: p.timestamp, y: p.value })),
        borderColor: color,
        backgroundColor: color + "22",
        borderWidth: 2,
        pointRadius: points.length <= 30 ? 4 : 2,
        pointHoverRadius: 6,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1a1d27",
          borderColor: "#2e3348",
          borderWidth: 1,
          titleColor: "#e2e8f0",
          bodyColor: "#8892a4",
          callbacks: { label: ctx => ` ${ctx.parsed.y} ${unit}` }
        }
      },
      scales: {
        x: {
          type: "time",
          time: { tooltipFormat: "MMM d, HH:mm" },
          grid: { color: "#2e334830" },
          ticks: { color: "#8892a4", maxTicksLimit: 6, font: { size: 11 } },
        },
        y: {
          grid: { color: "#2e334840" },
          ticks: { color: "#8892a4", font: { size: 11 }, callback: v => `${v} ${unit}` },
        }
      }
    }
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  const updatedEl  = document.getElementById("updated-at");
  const clientsEl  = document.getElementById("clients");
  const emptyState = document.getElementById("empty-state");

  try {
    const groups = await loadAll();

    if (groups.length === 0) {
      emptyState.style.display = "block";
      updatedEl.textContent = "No data yet";
      return;
    }

    updatedEl.textContent = `Updated ${new Date().toLocaleString()}`;

    let globalColorIdx = 0;

    groups.forEach(({ client, benchmarks }) => {
      const section = document.createElement("section");
      section.className = "client-section";

      const icon = CLIENT_ICONS[client.toLowerCase()] ?? "📦";
      const header = document.createElement("div");
      header.className = "client-header";
      header.innerHTML = `
        <span class="client-icon">${icon}</span>
        <span class="client-name">${escHtml(client)}</span>
        <span class="client-count">${benchmarks.length} metric${benchmarks.length !== 1 ? "s" : ""}</span>
      `;
      section.appendChild(header);

      const grid = document.createElement("div");
      grid.className = "benchmark-grid";
      section.appendChild(grid);
      clientsEl.appendChild(section);

      benchmarks.forEach(({ name, entries }) => {
        const { card, color, unit, canvasId } = buildCard(client, name, entries, globalColorIdx++);
        grid.appendChild(card);
        renderChart(canvasId, entries, color, unit);
      });
    });

  } catch (err) {
    updatedEl.textContent = "Error loading data";
    console.error(err);
    emptyState.style.display = "block";
  }
}

init();
</script>
</body>
</html>
